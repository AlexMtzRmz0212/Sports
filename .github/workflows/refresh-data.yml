name: Refresh data

# Rebuilds public/data from the MLB Stats API and ESPN once a day and commits any
# changes. Vercel redeploys the site whenever main changes.
on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ligamx_fetch.py (API-Football, quota-limited) is manual; everything here is keyless.
      - run: python pipeline/build_all.py
      - name: Commit changed data
        run: |
          git add public data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git push
          fi
